name: Publish

# npm refuses to republish a version and unpublish is restricted after 72
# hours, so this runs from a GitHub Release rather than from every push.
#
# ORDER MATTERS: this package depends on @gitloomhq/sdk, so release the SDK
# first. Until the version this package asks for is on npm, the install below
# cannot resolve and the job fails before it publishes anything.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # the publish credential itself, via trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to gate a publish behind a
    # human.
    environment: npm
    steps:
      - uses: actions/checkout@v4
      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1, and the
      # npm that ships with the runner is older. No registry-url: it writes an
      # .npmrc expecting NODE_AUTH_TOKEN, and an empty one there gets in the
      # way of the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm new enough to trust-publish
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm install
      - run: npm run typecheck
      - run: npm run build

      - name: Tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          pkg=$(node -p "require('./package.json').version")
          [ "${tag#v}" = "$pkg" ] || {
            echo "::error::release tag $tag does not match package.json version $pkg"; exit 1; }

      # npm reports a duplicate version as a 403 that reads like an auth
      # failure, so say what it actually is.
      - name: Version is not already published
        run: |
          pkg=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "::error::$name@$pkg is already on npm — bump the version"; exit 1
          fi

      # No token: the id-token permission above is the credential. npm
      # exchanges the OIDC token for a short-lived one, and generates the
      # provenance attestation on its own — passing --provenance is neither
      # needed nor wanted here.
      - name: Publish
        run: npm publish --access public

      - name: Summary
        if: always()
        run: |
          {
            echo "### npm publish"
            echo ""
            echo "- package \`$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")\`"
            echo "- commit \`${{ github.sha }}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
