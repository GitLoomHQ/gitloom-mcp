name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install`, not `npm ci`: no lockfile is tracked. package.json pins
      # @gitloomhq/sdk exactly, because this release is tested against that SDK
      # and no other. Release the SDK first, then this; until the pinned
      # version is on npm, this install fails.
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

      # The bin is what `npx @gitloomhq/mcp` executes, so it has to be a real
      # executable with a shebang — tsup only adds one because the build script
      # asks it to, and losing that turns the package into a silent no-op.
      - name: Built binary is executable
        run: |
          head -1 dist/index.js | grep -q '^#!/usr/bin/env node' \
            || { echo "::error::dist/index.js lost its shebang"; exit 1; }

      # The version a host displays comes from the bundle, so a build that
      # dropped the substitution would report the wrong server version with
      # nothing else failing.
      - name: Reports the package version
        run: |
          ver=$(node -p "require('./package.json').version")
          grep -q "\"$ver\"" dist/index.js \
            || { echo "::error::dist/index.js does not carry version $ver"; exit 1; }

      # A missing, empty, blank or malformed key must be refused on stderr
      # with the setup help and a non-zero exit, never a stack trace. stdout
      # carries protocol frames, so a stray line there corrupts the stream and
      # a host reports it as the server dying.
      - name: Refuses to start without a usable key
        run: |
          err=$(mktemp)
          for k in unset empty blank control; do
            case $k in
              unset)   run=(env -u GITLOOM_API_KEY) ;;
              empty)   run=(env GITLOOM_API_KEY='') ;;
              blank)   run=(env GITLOOM_API_KEY=' ') ;;
              control) run=(env GITLOOM_API_KEY=$'a\r\nb') ;;
            esac
            set +e
            out=$("${run[@]}" node dist/index.js </dev/null 2>"$err"); code=$?
            set -e
            [ "$code" -ne 0 ] || { echo "::error::$k key: the server started"; exit 1; }
            [ -z "$out" ] || { echo "::error::$k key: wrote to stdout, which carries protocol frames: $out"; exit 1; }
            if grep -q '^    at ' "$err"; then
              echo "::error::$k key: printed a stack trace"; cat "$err"; exit 1
            fi
            grep -qF 'Create a key at https://app.gitloom.cloud/' "$err" \
              || { echo "::error::$k key: no setup help on stderr"; cat "$err"; exit 1; }
            echo "$k key: refused with exit $code"
          done
